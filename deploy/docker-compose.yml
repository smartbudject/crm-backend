services:
  postgres:
    image: postgres:16
    container_name: my-postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dp:/var/lib/postgresql/data
    networks:
      - app-network

  my-java-app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: my-java-app
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mydb
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: mypassword

    networks:
      - app-network

volumes:
  postgres_data_dp:


networks:
  app-network:
    driver: bridge